<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gauntlet</title>
<meta name="description" content="Pauper gauntlet buylist for Eka and Lucas">
<meta name="theme-color" content="#0c0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gauntlet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,400;100,500;100,600;100,700;125,800;125,900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: mobile app shell — sticky header with totals, deck rail, deck hero + card list with copy balls, bottom tab bar, bottom sheet for purchases */
:root{
  --bg:#f3f3f0; --surface:#ffffff; --raise:#ecece8; --line:#dddcd6; --fg:#121316; --muted:#6f7178; --faint:#a3a4a9;
  --gold:#b88600; --gold-ink:#ffffff; --good:#1f8a4c; --bad:#c23b2e;
  --g:#2f8a46; --c:#8a7f6c; --u:#2766c4; --r:#d0402a; --b:#5b4a63; --w:#b59a3c;
  --display:"Archivo",system-ui,sans-serif; --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r-lg:22px; --r-md:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0d10; --surface:#16181d; --raise:#1f2229; --line:#2a2e37; --fg:#f3f4f6; --muted:#8d929d; --faint:#5b606b;
  --gold:#ffc83d; --gold-ink:#1b1400; --good:#4fd18b; --bad:#ff6b5c;
  --g:#47c46a; --c:#c2b59c; --u:#4c95ff; --r:#ff5b3d; --b:#b49ac4; --w:#f1d77a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0d10; --surface:#16181d; --raise:#1f2229; --line:#2a2e37; --fg:#f3f4f6; --muted:#8d929d; --faint:#5b606b;
  --gold:#ffc83d; --gold-ink:#1b1400; --good:#4fd18b; --bad:#ff6b5c;
  --g:#47c46a; --c:#c2b59c; --u:#4c95ff; --r:#ff5b3d; --b:#b49ac4; --w:#f1d77a; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font:16px/1.4 var(--body);font-stretch:100%;margin:0 auto;max-width:620px;padding-inline:16px;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.x{font-family:var(--display);font-stretch:125%;font-weight:900;text-transform:uppercase;letter-spacing:-.01em}

/* header */
header.top{position:relative;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);margin-inline:-16px;padding:12px 16px 12px;display:grid;gap:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;object-fit:cover;flex:none;box-shadow:0 0 0 2px var(--gold)}
.brand h1{margin:0;font-size:22px;line-height:1}
.brand small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:3px}
.sync{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.sync.on i{background:var(--good)}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;display:grid;gap:2px;min-width:0}
.stat small{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat b{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.hot b{color:var(--gold)}
.prog{height:6px;border-radius:3px;background:var(--raise);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--gold);border-radius:3px;transition:width .4s}

/* deck rail */
.rail{display:flex;gap:10px;overflow-x:auto;margin:16px -16px 6px;padding:2px 16px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.dk{flex:0 0 148px;height:104px;border-radius:18px;position:relative;overflow:hidden;scroll-snap-align:start;text-align:left;color:#fff;background:var(--raise);box-shadow:inset 0 0 0 2px transparent;transition:transform .15s}
.dk[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--dc),0 6px 20px -8px var(--dc)}
.dk:active{transform:scale(.97)}
.dk img,.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dk .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgb(0 0 0/0) 20%,rgb(0 0 0/.82))}
.dk .fill{position:absolute;inset:0;background:linear-gradient(135deg,var(--dc),color-mix(in srgb,var(--dc) 35%,#000))}
.dk .t{position:absolute;left:12px;right:12px;bottom:10px;display:grid;gap:5px}
.dk .t b{font-size:15px;line-height:1.05}
.dk .t span{font-size:12px;opacity:.85;font-family:var(--mono)}
.mini{height:4px;border-radius:2px;background:rgb(255 255 255/.25);overflow:hidden}
.mini i{display:block;height:100%;background:var(--dc)}

/* deck page */
.hero{position:relative;aspect-ratio:16/7;border-radius:var(--r-lg);overflow:hidden;background:var(--raise);max-width:100%}
.hero .fill{position:absolute;inset:0;background:linear-gradient(135deg,var(--dc),color-mix(in srgb,var(--dc) 30%,#000))}
.hero .credit{position:absolute;right:10px;bottom:8px;font-size:10px;color:rgb(255 255 255/.8);background:rgb(0 0 0/.45);padding:2px 7px;border-radius:99px}
.dtitle{margin:16px 0 0;font-size:34px;line-height:.95;text-wrap:balance}
.glink{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:14px;font-weight:600;color:var(--dc);text-decoration:none;min-height:32px}
.glink:hover{text-decoration:underline}
.dmeta{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 14px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;background:var(--surface);border:1px solid var(--line);padding:6px 12px;font-size:13px;font-weight:600}
.chip b{font-family:var(--mono)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--raise);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{min-height:44px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgb(0 0 0/.12)}
.grp{display:flex;justify-content:space-between;align-items:baseline;margin:20px 2px 10px}
.grp h3{margin:0;font-size:15px}
.grp span{font-size:13px;color:var(--muted);font-family:var(--mono)}
.list{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;display:grid;gap:12px}
.card.done{border-color:color-mix(in srgb,var(--dc) 45%,var(--line))}
.ch{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.cn{min-width:0}
.cn b{display:block;font-size:17px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.cn .sug{display:block;font-size:13px;color:var(--muted);margin-top:3px}
.cn .paid{display:block;font-size:13px;color:var(--fg);margin-top:2px;font-weight:600}
.cn .paid em{font-style:normal;color:var(--muted);font-weight:500}
.cnt{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap;padding-top:2px}
.card.done .cnt{color:var(--dc)}
.balls{display:flex;flex-wrap:wrap;gap:10px}
.ball{width:40px;height:40px;border-radius:50%;border:2.5px solid color-mix(in srgb,var(--dc) 70%,var(--line));display:grid;place-items:center;transition:transform .12s,background .15s;position:relative}
.ball:active{transform:scale(.88)}
.ball.on{background:var(--dc);border-color:var(--dc)}
.ball svg{width:20px;height:20px;opacity:0}
.ball.on svg{opacity:1}
.ball.small{width:32px;height:32px}
.ball.small svg{width:16px;height:16px}
.empty{padding:32px 18px;text-align:center;color:var(--muted);background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r-md)}

/* rows for shop/log */
.row{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;text-align:left;min-height:64px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--dc);flex:none}
.row b{display:block;font-weight:700;overflow-wrap:anywhere}
.row small{display:block;color:var(--muted);font-size:13px}
.btn{min-height:48px;padding:0 18px;border-radius:14px;font-weight:700;font-size:15px;background:var(--raise);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.danger{background:transparent;border:1.5px solid color-mix(in srgb,var(--bad) 50%,var(--line));color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}

/* setup */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:grid;gap:14px;margin-bottom:14px}
.panel h2{margin:0;font-size:20px}
.hint{margin:0;color:var(--muted);font-size:14px}
label.f{display:grid;gap:6px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.02em}
input,select,textarea{font:16px var(--body);color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-height:50px}
textarea{min-height:180px;font:14px/1.5 var(--mono)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:50%;background:var(--sc);box-shadow:inset 0 0 0 3px transparent}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--sc)}
.drow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.drow:first-of-type{border-top:0}
.drow .nm{flex:1;min-width:0}
.drow .nm b{display:block}
.drow .nm small{color:var(--muted);font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(4,1fr);max-width:620px;margin:0 auto}
nav.tabs button{min-height:56px;border-radius:14px;display:grid;place-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted);padding:6px 0}
nav.tabs svg{width:24px;height:24px}
nav.tabs button[aria-selected="true"]{color:var(--fg)}
nav.tabs button[aria-selected="true"] svg{color:var(--gold)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0/.5);z-index:30;animation:fade .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:26px 26px 0 0;max-width:620px;margin:0 auto;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;max-height:92vh;max-height:92dvh;overflow:auto;animation:up .25s cubic-bezier(.2,.9,.3,1)}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheet h3{margin:0;font-size:24px;line-height:1.05;text-wrap:balance}
.sheet .sub{margin:-10px 0 0;color:var(--muted);font-size:14px}
.qrow{display:flex;flex-wrap:wrap;gap:10px}
.qb{width:52px;height:52px;border-radius:50%;border:2.5px solid var(--dc);display:grid;place-items:center;font:700 16px var(--mono);color:var(--dc)}
.qb.on{background:var(--dc);color:#fff}
.money{position:relative}
.money span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--muted)}
.money input{padding-left:44px;font:700 22px var(--mono);min-height:58px}
.total{display:flex;justify-content:space-between;align-items:baseline;background:var(--raise);border-radius:12px;padding:12px 14px}
.total small{color:var(--muted);font-weight:600}
.total b{font-size:20px}
.conds{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.conds button{min-height:52px;border-radius:12px;border:1.5px solid var(--line);display:grid;place-items:center;line-height:1.1;padding:4px 2px}
.conds button b{font-size:15px}
.conds button small{font-size:10px;color:var(--muted);font-weight:600}
.conds button[aria-pressed="true"]{border-color:var(--dc);background:color-mix(in srgb,var(--dc) 16%,transparent)}
.mkt{font-size:13px;color:var(--muted);margin-top:-6px}
.sheet .acts{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:99px;font-weight:600;font-size:14px;z-index:40;white-space:nowrap;animation:fade .2s}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){.stat b{font-size:15px}.ball{width:36px;height:36px}}
header.top{padding-top:calc(12px + env(safe-area-inset-top,0px))}
.gate{min-height:70vh;display:grid;align-content:center;gap:16px;padding-block:24px}
.gate .logo{width:88px;height:88px;border-radius:24px}
.linkbox{font:13px/1.4 var(--mono);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px;overflow-wrap:anywhere;user-select:all}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <img class="logo" alt="" src="icons/icon-192.png">
    <div><h1 class="x">Gauntlet</h1><small>Pauper buylist · Eka &amp; Lucas</small></div>
    <span class="sync" id="sync"><i></i>Connecting</span>
  </div>
  <div class="stats">
    <div class="stat hot"><small>Spent</small><b class="num" id="sSpent">Rp 0</b></div>
    <div class="stat"><small>To finish ≈</small><b class="num" id="sLeft">—</b></div>
    <div class="stat"><small>Cards</small><b class="num" id="sCards">0/0</b></div>
  </div>
  <div class="prog"><i id="sProg"></i></div>
</header>

<main id="view"></main>
<div id="sheetRoot"></div>

<nav class="tabs" role="tablist">
  <button role="tab" data-tab="decks" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="12" height="17" rx="2"/><path d="M8 3.5V3a2 2 0 0 1 2-1h8a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2"/></svg>Decks</button>
  <button role="tab" data-tab="shop" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h2l2.4 10.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20 8H6.2"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>To buy</button>
  <button role="tab" data-tab="log" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Purchases</button>
  <button role="tab" data-tab="setup" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Decks setup</button>
</nav>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="seed.js"></script>
<script>
const DATA=window.DATA;
const ART={
  elves:{src:"art/elves.webp",credit:"Priest of Titania · Rebecca Guay"},
  tron:{src:"art/tron.webp",credit:"Urza's Tower · Brian Snõddy"},
  blue:{src:"art/blue.webp",credit:"Tolarian Terror · Vincent Christiaens"},
  burn:{src:"art/burn.webp",credit:"Lightning Bolt · Christopher Moeller"},
};
const COLORS={g:"Green",u:"Blue",r:"Red",b:"Black",w:"White",c:"Colourless"};
const CONDS=[["NM","Near mint"],["LP","Light"],["MP","Moderate"],["HP","Heavy"],["DMG","Damaged"]];
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const S={decks:[],cards:[],buys:[],settings:{},deck:null,board:"main",todo:false,tab:"decks",db:null,me:(()=>{try{return localStorage.getItem("gauntlet-name")||""}catch{return ""}})(),mode:"",key:"",ready:{d:0,c:0,b:0},readOnly:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fx=()=>Number(S.settings.fx)||16500;
const rp=n=>"Rp "+Math.round(n||0).toLocaleString("id-ID");
const rpk=n=>{n=Math.round(n||0);if(n>=1e6)return "Rp "+(n/1e6).toLocaleString("id-ID",{maximumFractionDigits:1})+"jt";if(n>=1e4)return "Rp "+Math.round(n/1e3).toLocaleString("id-ID")+"k";return rp(n)};
const parseIDR=v=>{v=String(v||"").toLowerCase().replace(/rp|\s/g,"");if(!v)return NaN;let m=1;if(/jt$/.test(v)){m=1e6;v=v.slice(0,-2)}else if(/k$/.test(v)){m=1e3;v=v.slice(0,-1)}
  if(m>1)return Math.round(parseFloat(v.replace(",","."))*m);const n=parseInt(v.replace(/[^\d]/g,""),10);return isNaN(n)?NaN:n};
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,80);
const info=name=>DATA.cards[name]||null;
const setName=c=>DATA.sets[c]||c?.toUpperCase();
function toast(t){document.querySelectorAll(".toast").forEach(x=>x.remove());const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
const deckOf=id=>S.decks.find(d=>d.id===id);
const dc=d=>`var(--${d?.color||"c"})`;
function artFor(d){if(!d)return null;if(d.art&&ART[d.art])return ART[d.art];if(d.cover)return{src:d.cover,credit:""};return null}

/* ---------- derived ---------- */
function buysFor(cid){return S.buys.filter(b=>b.cardId===cid).sort((a,b)=>(a.at||0)-(b.at||0))}
function got(c){return buysFor(c.id).reduce((a,b)=>a+(b.qty||0),0)}
function spentOn(c){return buysFor(c.id).reduce((a,b)=>a+(b.total||0),0)}
function sugIDR(name,set){const i=info(name);if(!i)return null;let usd=i.m;if(set){const p=i.s.find(x=>x[0]===set);if(p&&p[1]!=null)usd=p[1]}return usd==null?null:usd*fx()}
function stats(deckId){let need=0,g=0,spent=0,left=0;for(const c of S.cards){if(deckId&&c.deck!==deckId)continue;if(!deckOf(c.deck))continue;const n=got(c);need+=c.need;g+=Math.min(n,c.need);spent+=spentOn(c);const s=sugIDR(c.name);if(s&&c.need>n)left+=(c.need-n)*s}return{need,got:g,spent,left}}

/* ---------- render ---------- */
function renderHeader(){const t=stats();$("#sSpent").textContent=rpk(t.spent);$("#sLeft").textContent=t.left?rpk(t.left):(t.need?"Rp 0":"—");$("#sCards").textContent=`${t.got}/${t.need}`;$("#sProg").style.width=(t.need?t.got/t.need*100:0)+"%"}
function rail(){return `<div class="rail">${S.decks.map(d=>{const s=stats(d.id);const a=artFor(d);
  return `<button class="dk" style="--dc:${dc(d)}" data-deck="${d.id}" aria-pressed="${S.deck===d.id}">${a?`<img src="${a.src}" alt="">`:`<span class="fill"></span>`}<span class="shade"></span><span class="t"><b class="x">${esc(d.name)}</b><span>${s.got}/${s.need}</span><span class="mini"><i style="width:${s.need?s.got/s.need*100:0}%"></i></span></span></button>`}).join("")}</div>`}
function ballsHTML(c,small){const n=got(c);let h="";for(let i=0;i<c.need;i++)h+=`<button class="ball${i<n?" on":""}${small?" small":""}" data-ball="${c.id}" data-i="${i}" aria-label="${esc(c.name)} copy ${i+1} ${i<n?"bought":"not bought"}">${CHECK}</button>`;
  if(n>c.need)h+=`<span class="chip">+${n-c.need} extra</span>`;return h}
function cardHTML(c){const n=got(c);const bs=buysFor(c.id);const sp=spentOn(c);const s=sugIDR(c.name);const i=info(c.name);
  const sug=s!=null?`Suggested ${rpk(s)} each <span class="num">· $${i.m.toFixed(2)}</span>`:"No market price on file";
  let paid="";if(bs.length){const eds=[...new Set(bs.map(b=>[b.set?b.set.toUpperCase():"",b.cond].filter(Boolean).join(" ")).filter(Boolean))];paid=`<span class="paid">Paid ${rp(sp)} <em>for ${n} · avg ${rpk(sp/Math.max(1,n))}${eds.length?" · "+esc(eds.join(", ")):""}</em></span>`}
  return `<div class="card${n>=c.need&&c.need?" done":""}"><div class="ch"><div class="cn"><b>${esc(c.name)}</b><span class="sug">${sug}</span>${paid}</div><span class="cnt">${n}/${c.need}</span></div><div class="balls">${ballsHTML(c,c.need>8)}</div></div>`}
function viewDecks(){
  if(!S.decks.length)return `<div style="margin-top:16px" class="empty">${S.ready.d?"No decks yet. Add one in Decks setup.":"Loading your decks…"}</div>`;
  if(!deckOf(S.deck))S.deck=S.decks[0].id;
  const d=deckOf(S.deck);const a=artFor(d);const s=stats(d.id);const cs=S.cards.filter(c=>c.deck===d.id).sort((x,y)=>(x.order??0)-(y.order??0));
  const nm=cs.filter(c=>c.board==="main").reduce((a,c)=>a+c.need,0),ns=cs.filter(c=>c.board==="side").reduce((a,c)=>a+c.need,0);
  let h=rail()+`<section style="--dc:${dc(d)}"><div class="hero">${a?`<img src="${a.src}" alt="">${a.credit?`<span class="credit">${esc(a.credit)}</span>`:""}`:`<span class="fill"></span>`}</div>
  <h2 class="dtitle x">${esc(d.name)}</h2>
  ${d.url?`<a class="glink" href="${esc(d.url)}" target="_blank" rel="noopener">View list on MTGGoldfish ↗</a>`:""}
  <div class="dmeta"><span class="chip"><b>${s.got}/${s.need}</b> cards</span><span class="chip">Spent <b>${rpk(s.spent)}</b></span>${s.left?`<span class="chip">Left ≈ <b>${rpk(s.left)}</b></span>`:""}</div>
  <div class="seg"><button data-board="main" aria-pressed="${S.board==="main"}">Main · ${nm}</button><button data-board="side" aria-pressed="${S.board==="side"}">Side · ${ns}</button><button data-todo aria-pressed="${S.todo}">Missing</button></div>`;
  const list=cs.filter(c=>c.board===S.board&&(!S.todo||got(c)<c.need));
  h+=list.length?`<div class="list">${list.map(cardHTML).join("")}</div>`:`<div class="empty">${S.todo?"Everything here is bought.":"No cards in this section."}</div>`;
  return h+"</section>"}
function shopGroups(){const m=new Map();for(const c of S.cards){if(!deckOf(c.deck))continue;const r=c.need-got(c);if(r<=0)continue;const k=c.name.toLowerCase();if(!m.has(k))m.set(k,{name:c.name,left:0,rows:[]});const g=m.get(k);g.left+=r;g.rows.push(c)}return [...m.values()].sort((a,b)=>(sugIDR(b.name)||0)*b.left-(sugIDR(a.name)||0)*a.left)}
function viewShop(){const gs=shopGroups();if(!gs.length)return `<h2 class="dtitle x">To buy</h2><div class="empty" style="margin-top:14px">${S.ready.c?"Nothing left to buy.":"Loading…"}</div>`;
  return `<h2 class="dtitle x">To buy</h2><p class="hint" style="margin:8px 0 14px">All decks combined, most expensive first. ${gs.reduce((a,g)=>a+g.left,0)} cards across ${gs.length} names.</p><div class="list">${gs.map(g=>{const s=sugIDR(g.name);const ds=[...new Set(g.rows.map(c=>c.deck))];
  return `<button class="row" data-shop="${esc(g.name)}"><span style="display:flex;gap:4px">${ds.map(x=>`<span class="dot" style="--dc:${dc(deckOf(x))}"></span>`).join("")}</span><span><b>${g.left}× ${esc(g.name)}</b><small>${ds.map(x=>esc(deckOf(x).name)).join(" · ")}${s?` · ≈ ${rpk(s)} each`:""}</small></span><span class="btn sm gold">Buy</span></button>`}).join("")}</div>`}
function viewLog(){const bs=[...S.buys].sort((a,b)=>(b.at||0)-(a.at||0));const tot=bs.reduce((a,b)=>a+(b.total||0),0);
  if(!bs.length)return `<h2 class="dtitle x">Purchases</h2><div class="empty" style="margin-top:14px">No purchases yet. Tap a ball on any card to log one.</div>`;
  return `<h2 class="dtitle x">Purchases</h2><p class="hint" style="margin:8px 0 14px">${bs.length} purchases · ${rp(tot)} total</p><div class="list">${bs.map(b=>{const d=deckOf(b.deck);const who=b.by||"";
  return `<button class="row" data-edit="${b.id}" style="--dc:${dc(d)}"><span class="dot"></span><span><b>${b.qty}× ${esc(b.name)}</b><small>${[d?.name,b.set?setName(b.set):"",b.cond,new Date(b.at).toLocaleDateString("en-GB",{day:"numeric",month:"short"}),who].filter(Boolean).map(esc).join(" · ")}</small></span><span style="text-align:right"><b class="num">${rpk(b.total)}</b><small class="num">${rpk(b.unit)} ea</small></span></button>`}).join("")}</div>`}
function viewSetup(){
  const decks=S.decks.map(d=>{const s=stats(d.id);return `<div class="drow"><span class="dot" style="--dc:${dc(d)}"></span><span class="nm"><b>${esc(d.name)}</b><small>${s.need} cards · ${s.got} bought</small></span><span class="acts"><button class="btn sm ghost" data-replace="${d.id}">Replace list</button><button class="btn sm danger" data-deldeck="${d.id}">Delete</button></span></div>`}).join("");
  return `<h2 class="dtitle x">Decks setup</h2><p class="hint" style="margin:8px 0 14px">Manage the gauntlet. Paste lists straight from MTGGoldfish: Download → Text File.</p>
  ${phonePanel()}
  <div class="panel"><h2 class="x">Your decks</h2><div>${decks||'<p class="hint">No decks yet.</p>'}</div></div>
  <div class="panel" id="deckForm"><h2 class="x" id="formTitle">Add a deck</h2>
   <input type="hidden" id="fId">
   <label class="f">Deck name<input id="fName" placeholder="e.g. Mono-Black Sacrifice" autocomplete="off"></label>
   <label class="f">Colour</label><div class="swatches" id="fColor">${Object.entries(COLORS).map(([k,v],i)=>`<button class="sw" style="--sc:var(--${k})" data-sw="${k}" aria-label="${v}" aria-pressed="${i===0}"></button>`).join("")}</div>
   <label class="f">MTGGoldfish link<input id="fUrl" type="url" inputmode="url" placeholder="https://www.mtggoldfish.com/…" autocomplete="off"></label>
   <label class="f">Decklist<textarea id="fList" placeholder="4 Lightning Bolt&#10;18 Mountain&#10;&#10;4 Pyroblast"></textarea></label>
   <label class="f">Cover picture (optional)<input id="fArt" type="file" accept="image/*"></label>
   <p class="hint" id="fNote">A blank line starts the sideboard. Prices and editions appear for cards already in this gauntlet; other cards can still be logged with a typed edition.</p>
   <div class="acts"><button class="btn gold wide" id="fSave">Add deck</button><button class="btn ghost wide" id="fCancel" hidden>Cancel</button></div></div>
  <div class="panel"><h2 class="x">Price reference</h2><label class="f">Rupiah per US dollar (for suggested prices)<input id="fFx" inputmode="numeric" value="${fx()}"></label><p class="hint">Suggested prices are TCGplayer market prices for the cheapest paper printing (via Scryfall, ${esc(DATA.updated||"2 Oct 2026")}), converted at this rate.</p><button class="btn ghost" id="fFxSave">Save rate</button></div>`}
function render(){renderHeader();document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===S.tab));
  const y=window.scrollY;const keep=S.tab==="setup"?snapshotForm():null;
  $("#view").innerHTML=S.tab==="decks"?viewDecks():S.tab==="shop"?viewShop():S.tab==="log"?viewLog():viewSetup();
  if(keep)restoreForm(keep);window.scrollTo(0,y);
  const sel=document.querySelector('.dk[aria-pressed="true"]');if(sel&&!S._railDone){sel.scrollIntoView({inline:"center",block:"nearest"});S._railDone=true}}
function snapshotForm(){const f=$("#deckForm");if(!f)return null;return{id:$("#fId").value,name:$("#fName").value,url:$("#fUrl").value,list:$("#fList").value,color:document.querySelector(".sw[aria-pressed=true]")?.dataset.sw,fx:$("#fFx")?.value,title:$("#formTitle").textContent}}
function restoreForm(k){if(!$("#deckForm"))return;$("#fId").value=k.id;$("#fName").value=k.name;$("#fUrl").value=k.url;$("#fList").value=k.list;if(k.fx!=null)$("#fFx").value=k.fx;setSwatch(k.color||"g");setFormMode(k.id)}

/* ---------- sheet ---------- */
function closeSheet(){$("#sheetRoot").innerHTML=""}
function sheet(html,deck){$("#sheetRoot").innerHTML=`<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true" style="--dc:${dc(deck)}"><div class="grab"></div>${html}</div>`}
function editionField(name,cur){const i=info(name);
  if(!i)return `<label class="f">Edition<input id="bSet" placeholder="Set name or code" value="${esc(cur||"")}" autocomplete="off"></label>`;
  return `<label class="f">Edition<select id="bSet"><option value="">Not sure / any</option>${i.s.map(([c,p])=>`<option value="${c}" ${c===cur?"selected":""}>${esc(setName(c))}${p!=null?` — $${p.toFixed(2)}`:""}</option>`).join("")}</select></label>`}
function condField(cur){return `<label class="f">Condition</label><div class="conds" id="bCond">${CONDS.map(([k,v])=>`<button data-cond="${k}" aria-pressed="${k===(cur||"NM")}"><b>${k}</b><small>${v}</small></button>`).join("")}</div>`}
function openBuy(rows,startQty){
  const name=rows[0].name;const deck=deckOf(rows[0].deck);
  const left=rows.reduce((a,c)=>a+Math.max(0,c.need-got(c)),0);
  if(S.readOnly){sheet(`<h3 class="x">${esc(name)}</h3><p class="hint">You can view this list but not log purchases. Ask Lucas for edit access.</p><button class="btn wide" data-close>Close</button>`,deck);return}
  if(left<=0){toast("All copies already bought");return}
  const last=[...S.buys].filter(b=>b.name===name).sort((a,b)=>b.at-a.at)[0];
  const q=Math.min(Math.max(1,startQty||left),left);
  const decks=[...new Set(rows.map(c=>deckOf(c.deck).name))].join(" · ");
  sheet(`<h3 class="x">${esc(name)}</h3><p class="sub">${esc(decks)} · ${left} still needed</p>
  <label class="f">How many did you buy?</label><div class="qrow" id="bQty">${Array.from({length:left},(_,i)=>`<button class="qb${i<q?" on":""}" data-q="${i+1}">${i+1}</button>`).join("")}</div>
  <label class="f">Price paid per card<div class="money"><span>Rp</span><input id="bUnit" inputmode="numeric" placeholder="15.000" value="${last?last.unit.toLocaleString("id-ID"):""}" autocomplete="off"></div></label>
  <div class="mkt" id="bMkt"></div>
  <div class="total"><small>Total</small><b class="num" id="bTot">Rp 0</b></div>
  ${editionField(name,last?.set||"")}
  ${condField(last?.cond)}
  <div class="acts"><button class="btn ghost" data-close>Cancel</button><button class="btn gold" id="bSave">Log ${q} bought</button></div>`,deck);
  let qty=q;const upd=()=>{const u=parseIDR($("#bUnit").value);$("#bTot").textContent=rp((isNaN(u)?0:u)*qty);$("#bSave").textContent=`Log ${qty} bought`;
    const set=$("#bSet").tagName==="SELECT"?$("#bSet").value:"";const s=sugIDR(name,set);$("#bMkt").textContent=s!=null?`Market ${set?setName(set):"cheapest printing"}: ≈ ${rp(s)} each`:""};
  $("#bQty").onclick=e=>{const b=e.target.closest("[data-q]");if(!b)return;qty=+b.dataset.q;document.querySelectorAll(".qb").forEach(x=>x.classList.toggle("on",+x.dataset.q<=qty));upd()};
  wireConds();$("#bUnit").oninput=upd;$("#bSet").onchange=upd;$("#bSet").oninput=upd;upd();
  $("#bSave").onclick=async()=>{const u=parseIDR($("#bUnit").value);if(isNaN(u)){toast("Enter the price in rupiah");$("#bUnit").focus();return}
    const set=$("#bSet").value.trim();const cond=document.querySelector("#bCond [aria-pressed=true]")?.dataset.cond||"NM";
    $("#bSave").disabled=true;let rest=qty;const plan=[];for(const c of rows){const r=Math.max(0,c.need-got(c));if(!r)continue;const t=Math.min(r,rest);plan.push([c,t]);rest-=t;if(!rest)break}
    const at=Date.now();try{for(const[c,n]of plan)await S.db.collection("buys").add({cardId:c.id,deck:c.deck,name:c.name,qty:n,unit:u,total:n*u,set:set.toLowerCase?set:"",cond,at,by:S.me||""});closeSheet();toast(`Logged ${qty}× ${name}`)}
    catch(e){fail(e);$("#bSave").disabled=false}}}
function openEdit(buy){const deck=deckOf(buy.deck);const ro=S.readOnly;
  sheet(`<h3 class="x">${esc(buy.name)}</h3><p class="sub">${buy.qty} ${buy.qty>1?"copies":"copy"} · ${esc(deck?.name||"")} · ${new Date(buy.at).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}</p>
  ${ro?`<p class="hint">${rp(buy.unit)} each · ${esc(buy.set?setName(buy.set):"Edition not set")} · ${esc(buy.cond||"")}</p><button class="btn wide" data-close>Close</button>`:`
  <label class="f">Price paid per card<div class="money"><span>Rp</span><input id="bUnit" inputmode="numeric" value="${(buy.unit||0).toLocaleString("id-ID")}" autocomplete="off"></div></label>
  <div class="total"><small>Total</small><b class="num" id="bTot">${rp(buy.total)}</b></div>
  ${editionField(buy.name,buy.set)}${condField(buy.cond)}
  <div class="acts"><button class="btn danger" id="bDel">Remove</button><button class="btn gold" id="bSave">Save changes</button></div>`}`,deck);
  if(ro)return;wireConds();$("#bUnit").oninput=()=>{const u=parseIDR($("#bUnit").value);$("#bTot").textContent=rp((isNaN(u)?0:u)*buy.qty)};
  $("#bSave").onclick=async()=>{const u=parseIDR($("#bUnit").value);if(isNaN(u)){toast("Enter the price in rupiah");return}
    try{await S.db.doc("buys/"+buy.id).update({unit:u,total:u*buy.qty,set:$("#bSet").value.trim(),cond:document.querySelector("#bCond [aria-pressed=true]")?.dataset.cond||"NM"});closeSheet();toast("Saved")}catch(e){fail(e)}};
  const del=$("#bDel");del.onclick=async()=>{if(!del.classList.contains("armed")){del.classList.add("armed");del.textContent="Tap to confirm";return}try{await S.db.doc("buys/"+buy.id).delete();closeSheet();toast("Purchase removed")}catch(e){fail(e)}}}
function wireConds(){$("#bCond").onclick=e=>{const b=e.target.closest("[data-cond]");if(!b)return;document.querySelectorAll("#bCond button").forEach(x=>x.setAttribute("aria-pressed",x===b))}}
function fail(e){console.error(e);if(e&&e.code==="permission-denied")toast("The database refused this. Check the passcode.");else toast("Couldn't save. Check the connection and try again.")}

/* ---------- deck form ---------- */
function setSwatch(k){document.querySelectorAll(".sw").forEach(x=>x.setAttribute("aria-pressed",x.dataset.sw===k))}
function setFormMode(id){const d=id?deckOf(id):null;$("#formTitle").textContent=d?`Replace ${d.name}`:"Add a deck";$("#fSave").textContent=d?"Save list":"Add deck";$("#fCancel").hidden=!d}
function parseList(txt){const out=[];let board="main";for(let line of txt.split(/\r?\n/)){line=line.trim();
  if(!line){if(out.some(c=>c.board==="main"))board="side";continue}if(/^sideboard/i.test(line)){board="side";continue}if(/^(deck|main ?deck|companion)\b/i.test(line))continue;
  const m=line.match(/^(\d+)\s*x?\s+(.+?)(\s+\([A-Za-z0-9]+\).*)?$/);if(!m)continue;const name=m[2].replace(/\s*<[^>]*>|\s*\[[^\]]*\]/g,"").trim();
  const ex=out.find(c=>c.board===board&&c.name.toLowerCase()===name.toLowerCase());if(ex)ex.need+=+m[1];else out.push({board,name,need:+m[1]})}return out}
async function saveDeck(btn){const id0=$("#fId").value;const name=$("#fName").value.trim();const list=parseList($("#fList").value);const color=document.querySelector(".sw[aria-pressed=true]")?.dataset.sw||"c";const url=$("#fUrl").value.trim();
  if(!name){toast("Give the deck a name");return}if(!list.length){toast("Paste the decklist");return}
  const main=list.filter(c=>c.board==="main").reduce((a,c)=>a+c.need,0),side=list.filter(c=>c.board==="side").reduce((a,c)=>a+c.need,0);
  if(!btn.classList.contains("armed")){btn.classList.add("armed");btn.textContent=`Save ${main} main + ${side} side`;return}
  btn.disabled=true;btn.textContent="Saving…";
  try{const id=id0||slug(name)+"-"+Date.now().toString(36).slice(-4);const prev=deckOf(id);let cover=prev?.cover||null;
    const file=$("#fArt")?.files?.[0];if(file)cover=await toCover(file);
    const doc={name,color,url,order:prev?.order??Date.now(),...(prev?.art?{art:prev.art}:{}),...(cover?{cover}:{})};await S.db.doc("decks/"+id).set(doc);
    const keep=new Set();let i=0;for(const c of list){const cid=`${id}-${c.board}-${slug(c.name)}`;keep.add(cid);await S.db.doc("cards/"+cid).set({deck:id,board:c.board,name:c.name,need:c.need,order:i++})}
    for(const c of S.cards.filter(x=>x.deck===id&&!keep.has(x.id))){if(got(c)>0)await S.db.doc("cards/"+c.id).update({need:0});else await S.db.doc("cards/"+c.id).delete()}
    S.deck=id;S.board="main";S.tab="decks";S._railDone=false;toast(`${name} saved`);render();window.scrollTo(0,0)}
  catch(e){fail(e);btn.disabled=false;btn.classList.remove("armed");setFormMode(id0)}}
async function deleteDeck(btn,id){const d=deckOf(id);if(!btn.classList.contains("armed")){btn.classList.add("armed");btn.textContent="Confirm delete";setTimeout(()=>{if(btn.isConnected){btn.classList.remove("armed");btn.textContent="Delete"}},4000);return}
  btn.disabled=true;try{await S.db.doc("decks/"+id).delete();toast(`${d.name} deleted`)}catch(e){fail(e)}}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{const t=e.target.closest("button,[data-close]");if(!t)return;
  if(t.hasAttribute("data-close")){closeSheet();return}
  if(t.dataset.tab){S.tab=t.dataset.tab;S._railDone=false;render();window.scrollTo(0,0);return}
  if(t.dataset.deck){S.deck=t.dataset.deck;S.board="main";render();return}
  if(t.dataset.board){S.board=t.dataset.board;render();return}
  if(t.hasAttribute("data-todo")){S.todo=!S.todo;render();return}
  if(t.dataset.ball){const c=S.cards.find(x=>x.id===t.dataset.ball);if(!c)return;const i=+t.dataset.i;const bs=buysFor(c.id);const n=got(c);
    if(i<n){let acc=0;for(const b of bs){acc+=b.qty;if(i<acc){openEdit(b);return}}}else openBuy([c],i+1-n);return}
  if(t.dataset.shop){const g=shopGroups().find(x=>x.name===t.dataset.shop);if(g)openBuy(g.rows);return}
  if(t.dataset.edit){const b=S.buys.find(x=>x.id===t.dataset.edit);if(b)openEdit(b);return}
  if(t.dataset.sw){setSwatch(t.dataset.sw);return}
  if(t.dataset.replace){const d=deckOf(t.dataset.replace);const cs=S.cards.filter(c=>c.deck===d.id).sort((a,b)=>(a.order??0)-(b.order??0));
    $("#fId").value=d.id;$("#fName").value=d.name;$("#fUrl").value=d.url||"";setSwatch(d.color||"c");
    $("#fList").value=cs.filter(c=>c.board==="main"&&c.need).map(c=>`${c.need} ${c.name}`).join("\n")+"\n\n"+cs.filter(c=>c.board==="side"&&c.need).map(c=>`${c.need} ${c.name}`).join("\n");
    setFormMode(d.id);$("#deckForm").scrollIntoView({behavior:"smooth",block:"start"});return}
  if(t.id==="fCancel"){$("#fId").value="";$("#fName").value="";$("#fUrl").value="";$("#fList").value="";setFormMode("");return}
  if(t.dataset.deldeck){deleteDeck(t,t.dataset.deldeck);return}
  if(t.id==="fSave"){saveDeck(t);return}
  if(t.id==="pSave"){const v=$("#pName").value.trim();S.me=v;try{localStorage.setItem("gauntlet-name",v)}catch{}toast(v?`Saved. Purchases will show "${v}"`:"Name cleared");return}
  if(t.id==="pCopy"){const v=shareLink();try{await navigator.clipboard.writeText(v);toast("Link copied")}catch{const el=$("#pLink");const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Select and copy the link")}return}
  if(t.id==="gGo"){const k=$("#gKey").value.trim().toLowerCase();if(!/^[a-z0-9-]{12,64}$/.test(k)){toast("Passcode: at least 12 letters, numbers or dashes");return}try{localStorage.setItem("gauntlet-key",k)}catch{}location.reload();return}
  if(t.id==="fFxSave"){const v=parseIDR($("#fFx").value);if(!(v>0)){toast("Enter a number");return}try{await S.db.doc("meta/settings").set({...S.settings,fx:v});toast("Rate saved")}catch(err){fail(err)}return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

/* ---------- helpers for the standalone app ---------- */
function shareLink(){const base=location.origin+location.pathname;return S.mode==="cloud"?`${base}#key=${S.key}`:base}
function phonePanel(){
  const status=S.mode==="cloud"?`<span class="chip"><span class="dot" style="--dc:var(--good)"></span>Synced with the shared list</span>`:`<span class="chip"><span class="dot" style="--dc:var(--bad)"></span>This phone only, not synced yet</span>`;
  return `<div class="panel"><h2 class="x">This phone</h2>${status}
  <label class="f">Your name (shown on purchases)<input id="pName" value="${esc(S.me)}" placeholder="Eka" autocomplete="name"></label>
  <button class="btn ghost" id="pSave">Save name</button>
  ${S.mode==="cloud"?`<label class="f">Setup link for another phone</label><div class="linkbox" id="pLink">${esc(shareLink())}</div><button class="btn gold" id="pCopy">Copy setup link</button><p class="hint">Send this to Eka on WhatsApp. Opening it connects his phone to this list. Anyone with the link can edit, so keep it between you.</p>`:""}
  </div>`}
function toCover(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
  const W=480,H=210,sh=Math.min(img.height,img.width*H/W),sw=sh*W/H,sx=(img.width-sw)/2,sy=(img.height-sh)*0.4;
  const c=document.createElement("canvas");c.width=W;c.height=H;c.getContext("2d").drawImage(img,sx,sy,sw,sh,0,0,W,H);
  let d=c.toDataURL("image/webp",0.6);if(!d.startsWith("data:image/webp"))d=c.toDataURL("image/jpeg",0.7);res(d)};img.src=r.result};r.readAsDataURL(file)})}

/* local fallback store: same calls as Firestore, kept on this phone only */
function localDB(){
  const K="gauntlet-local";let st={};try{st=JSON.parse(localStorage.getItem(K))||{}}catch{}
  const cl={},dl={};const save=()=>{try{localStorage.setItem(K,JSON.stringify(st))}catch{}};
  const cs=c=>({metadata:{fromCache:false},docs:Object.entries(st[c]||{}).map(([id,d])=>({id,data:()=>d}))});
  const ds=(c,id)=>({id,exists:!!(st[c]&&st[c][id]),data:()=>st[c]?.[id]});
  const emit=(c,id)=>{(cl[c]||[]).forEach(f=>f(cs(c)));(dl[c+"/"+id]||[]).forEach(f=>f(ds(c,id)))};
  const doc=(c,id)=>({id,
    set:async d=>{(st[c]??={})[id]=JSON.parse(JSON.stringify(d));save();emit(c,id)},
    update:async d=>{if(!st[c]?.[id])throw{code:"not-found"};Object.assign(st[c][id],JSON.parse(JSON.stringify(d)));save();emit(c,id)},
    delete:async()=>{if(st[c])delete st[c][id];save();emit(c,id)},
    onSnapshot:f=>{(dl[c+"/"+id]??=[]).push(f);setTimeout(()=>f(ds(c,id)));return()=>{}}});
  return{
    collection:c=>({add:async d=>{const id=Math.random().toString(36).slice(2,12)+Date.now().toString(36);await doc(c,id).set(d);return{id}},
      doc:id=>doc(c,id),onSnapshot:f=>{(cl[c]??=[]).push(f);setTimeout(()=>f(cs(c)));return()=>{}}}),
    doc:p=>{const[c,id]=p.split("/");return doc(c,id)},
    batchSet:async ops=>{for(const[c,id,d]of ops)(st[c]??={})[id]=d;save();Object.keys(cl).forEach(c=>emit(c,""))}};
}
function cloudDB(cfg,key){
  firebase.initializeApp(cfg);const fs=firebase.firestore();
  try{fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch{}
  const root=fs.collection("g").doc(key);
  return{collection:c=>root.collection(c),doc:p=>{const[c,id]=p.split("/");return root.collection(c).doc(id)},
    batchSet:async ops=>{for(let i=0;i<ops.length;i+=400){const b=fs.batch();for(const[c,id,d]of ops.slice(i,i+400))b.set(root.collection(c).doc(id),d);await b.commit()}}};
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function gate(){
  $("#view").innerHTML=`<div class="gate"><img class="logo" src="icons/icon-192.png" alt=""><h2 class="dtitle x" style="margin:0">Join the gauntlet</h2>
  <p class="hint">Open the setup link Lucas sent you, or type the passcode here.</p>
  <label class="f">Passcode<input id="gKey" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="e.g. tron-elves-4821"></label>
  <button class="btn gold wide" id="gGo">Connect</button></div>`;
  $("#sync").innerHTML="<i></i>Not connected";document.querySelector("nav.tabs").hidden=true}

/* ---------- boot ---------- */
(async()=>{
  const CFG=window.GAUNTLET_CONFIG||{};
  const m=location.hash.match(/key=([a-z0-9-]{12,64})/i);
  if(m){try{localStorage.setItem("gauntlet-key",m[1].toLowerCase())}catch{}history.replaceState(null,"",location.pathname)}
  let key="";try{key=localStorage.getItem("gauntlet-key")||""}catch{}
  if(CFG.firebase){
    if(!key){gate();return}
    try{await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js");await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js");
      S.db=cloudDB(CFG.firebase,key);S.mode="cloud";S.key=key}
    catch(e){console.error(e);S.db=localDB();S.mode="local";toast("Couldn't reach the shared list. Working on this phone only.")}
  }else{S.db=localDB();S.mode="local"}
  render();
  const db=S.db;let seeded=false;
  const live=()=>{const s=$("#sync");s.className="sync"+(S.mode==="cloud"?" on":"");s.innerHTML=`<i></i>${S.mode==="cloud"?"Live":"This phone only"}`};
  const err=e=>{console.error(e);const s=$("#sync");s.className="sync";s.innerHTML=e&&e.code==="permission-denied"?"<i></i>Wrong passcode?":"<i></i>Reconnecting"};
  db.collection("decks").onSnapshot(async s=>{
    if(s.docs.length===0&&!s.metadata.fromCache&&!seeded&&window.SEED){seeded=true;
      try{await db.batchSet([...SEED.decks.map(({id,...d})=>["decks",id,d]),...SEED.cards.map(({id,...d})=>["cards",id,d])]);toast("Decklists loaded")}catch(e){err(e)}return}
    S.decks=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order??0)-(b.order??0));S.ready.d=1;live();render()},err);
  db.collection("cards").onSnapshot(s=>{S.cards=s.docs.map(d=>({id:d.id,...d.data()}));S.ready.c=1;live();render()},err);
  db.collection("buys").onSnapshot(s=>{S.buys=s.docs.map(d=>({id:d.id,...d.data()}));S.ready.b=1;render()},err);
  db.doc("meta/settings").onSnapshot(s=>{S.settings=s.exists?{...s.data()}:{};render()},err);
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
